<header><h1 id="appTitle">Zemannim secondo il Mishne Tora</h1><button id="settingsBtn">Impostazioni</button></header>

<template id="notesTpl"><div class="notesdoc">
<p>Ogni regola dell’app, con la fonte e lo stato. <b>MT</b> = letto nel Mishne Tora (testo di mechon-mamre.org); <b>Comm.</b> = Commento alla Mishna del Rambam; <b>dedotto</b> = conclusione nostra; <b>scelta</b> = decisione dell’utente. Le voci con un’impostazione si possono invertire.</p>
<h4>Ore stagionali <span class="st">dedotto</span></h4><p>Il giorno va dal sorgere al tramonto, diviso in 12 ore. La quarta ora finisce a «שליש היום» (Tefilla 3:1); la preghiera comincia «עם הנץ החמה» (3:1) e la minḥà si può dire «עד שתשקע החמה» (3:4).</p>
<h4>Ṣeth ha-kokhavim = fine dello Shabbath <span class="st">MT · scelta</span></h4><p>20 minuti fissi dopo il tramonto: «וזה העת כמו שליש שעה אחר שקיעת החמה» (Terumoth 7:2). In alternativa 18 minuti: ¾ di mil, con il mil di «שני חומשי שעה משעות ההשויה» (Comm. Pesaḥim 3:2). Non ho trovato il passo in cui il Rambam stesso enuncia i ¾ di mil; Shabbath 5:4 parla solo di tre stelle medie. <i>Impostazione: 20 / 18.</i></p>
<h4>ʿAlòth ha-shaḥar <span class="st">Comm. · scelta</span></h4><p>Il MT usa l’alba come limite (Qeriath Shemaʿ 1:10–13; Tefilla 3:6–7) ma, nei capitoli letti, non ne dà la distanza dal sorgere. Si usa il Comm. Berakhoth 1:1: «בכדי שעה וחומש שעה מן השעות הזמניות», intese come ore stagionali del giorno (lettura nostra). <i>Impostazione: mostra / nascondi.</i></p>
<h4>Orari del giorno <span class="st">MT</span></h4><p>Shemaʿ del mattino: fine della 3ª ora (Qeriath Shemaʿ 1:12–14). Shaḥrith: fino alla fine della 4ª ora (Tefilla 3:1). Musaf: fino a 7 ore, solo nei giorni con Musaf (3:5). Minḥà gedolà da 6½, qetannà da 9½, fino a quando resta 1¼ ore, e si può pregare fino al tramonto (3:2, 3:4). Mezzanotte: fine preferibile dello Shemaʿ della sera (Qeriath Shemaʿ 1:10); il MT non la definisce, la calcoliamo a metà fra tramonto e sorgere <span class="st">dedotto</span>.</p>
<h4>Accensione dei lumi <span class="st">MT</span></h4><p>Non mostrata: il MT dice solo «מבעוד יום, קודם שקיעת החמה» (Shabbath 5:3), senza minuti.</p>
<h4>Sole <span class="st">scelta</span></h4><p>Sorgere e tramonto a livello del mare, senza correzione per l’altitudine (i passi letti non ne parlano). Algoritmo NOAA; differenza dagli orari di Zemaneh Yosef per Ferrara: entro il minuto.</p>
<h4>Arrotondamento <span class="st">scelta tecnica</span></h4><p>Con l’arrotondamento prudente i termini finali sono arrotondati al minuto precedente, gli inizi al minuto seguente. Non è una regola del MT. <i>Impostazione: sì / no.</i></p>
<h4>Nefilath appayim <span class="st">MT · scelta</span></h4><p>Non si fa: Shabbath, feste e Ḥol ha-moʿed («מועדות»; Ḥol ha-moʿed incluso per scelta), Rosh ha-Shanà, Rosh Ḥodesh, Ḥanukkà, Purim, Minḥà della vigilia di Shabbath e di festa (Tefilla 5:16 [15]). Di sera non si fa mai («ולא בערבית שבכל יום»), tranne a Yom ha-Kippurim, quando si fa in ogni preghiera; per questo ʿArvith compare solo quel giorno. In tutti gli altri giorni si fa, anche il 9 di Av e a Minḥà della vigilia di Kippur: i «ימים טובים» sono i sei giorni elencati in Shevitath Yom Ṭov 1:1, tra cui Kippur non c’è, e Tefilla 5:16 tratta Kippur come caso a sé. Applicare la definizione di 1:1 alla norma sulla preghiera è una nostra lettura, approvata come scelta.</p>
<h4>Pioggia <span class="st">MT · rito italiano</span></h4><p>Menzione nella seconda benedizione da Musaf di Shemini ʿAṣereth (diaspora: primo giorno) fino a Shaḥrith del primo giorno di Pesaḥ (Tefilla 2:17, 2:19). Formula del rito italiano: «משיב הרוח ומוריד הגשם»; d’estate nulla (non «מוריד הטל»). Richiesta in Birkath ha-shanim: in Israele dal 7 di Marḥeshwan; fuori dal 60° giorno dopo la tequfa di Tishri, contando come 1° il giorno della tequfa, finché si menziona la pioggia (2:18). Il MT nomina Shinʿar, Siria ed Egitto «והדומין להן»: l’applicazione all’Europa è nostra.</p>
<h4>Tequfa <span class="st">MT · scelta reversibile</span></h4><p>Si usa il cap. 9 di Qiddush ha-Ḥodesh (anno di 365¼ giorni; tequfa di Nisan dell’anno 1 = 7 g 9 h 642 ḥ prima del molad, 9:3). Il cap. 10 (365 g 5 h 997 ḥ 48 r; 9 h 642 ḥ prima del molad, 10:3) è detto «האמת יותר» (10:6) e anticipa la richiesta di circa 11 giorni (nel 2026: 24 novembre invece del 5 dicembre). <i>Impostazione: cap. 9 / cap. 10.</i></p>
<h4>Israele, secondo giorno di festa, Purim <span class="st">scelta</span></h4><p>Israele o diaspora si ricava dalla posizione (confine approssimativo). Purim il 15 entro circa 6 km dalla Città Vecchia di Gerusalemme, altrimenti il 14; negli anni embolismici in Adar II. <i>Impostazioni: automatico / sì / no.</i></p>
<h4>Parashoth <span class="st">verificato</span></h4><p>Lettura annuale (Tefilla 13:1). Calcolate con un algoritmo nostro e confrontate con la libreria Hebcal per 600 anni (5600–6199), in Israele e nella diaspora: nessuna differenza. Si mostra la lettura del luogo scelto; quando Israele e diaspora leggono parashoth diverse, compare sotto anche l’altra.</p>
<h4>Lingue <span class="st">scelta</span></h4><p>I termini ebraici compaiono sempre; le didascalie possono essere in italiano, inglese o francese, oppure si può scegliere il solo ebraico. Le didascalie italiane usano le forme del Mahazor (Minḥà, Ḥanukkà); quelle inglesi e francesi la romanizzazione scientifica senza accento (Minḥa, Ḥanukka). Queste note restano in italiano. <i>Impostazione: italiano / English / Français / solo ebraico.</i></p>
<h4>Da fare</h4><p>Revisione dei testi inglesi e francesi.Haftaroth secondo il rito italiano (da verificare insieme). Romanizzazione delle parashoth: provvisoria, da allineare al Mahazor. Fuso orario: con la posizione GPS si usa il fuso del dispositivo.</p>
