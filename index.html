<p>Le scelte principali dell’app, con la fonte. Il testo del Mishné Torà (MT) è quello di mechon-mamre.org, che segue i manoscritti yemeniti; fra parentesi quadre il numero dell’halakhà nelle edizioni a stampa, dove è diverso. <b>Comm.</b> = Commento alla Mishnà del Rambam. Le voci con un’impostazione si possono invertire. Le note complete, con tutte le citazioni, sono su GitHub: <a href="https://github.com/arinohem/zemannim/blob/main/docs/note-sulle-scelte.md" target="_blank" rel="noopener">versione completa</a>.</p>
<h3>Orari</h3>
<h4>Ore stagionali</h4><p>Il giorno va dal sorgere del sole al tramonto, diviso in 12 ore (Tefillà 3:1, 3:4).</p>
<h4>Orari del giorno</h4><p>Shemaʿ del mattino: fino alla fine della 3ª ora (Qeriʾaṯ Shemaʿ 1:12–14 [11–13]). Shaḥriṯ: fino alla fine della 4ª (Tefillà 3:1). Musaf, nei giorni in cui si dice: fino alla fine della 7ª ora; chi prega dopo esce d’obbligo, pur essendo in difetto, perché il suo tempo è tutto il giorno (3:5). Mezzogiorno: fine della 6ª ora (3:1). Minḥà geḏolà da 6½ ore, qeṭannà da 9½; si può recitare Minḥà fino al tramonto (3:2, 3:4). Mezzanotte: termine preferibile dello Shemaʿ della sera (Qeriʾaṯ Shemaʿ 1:10 [9]); il MT non la definisce, e la calcoliamo a metà fra il tramonto e il sorgere del sole.</p>
<h4>Ḥameṣ la vigilia di Pèsaḥ</h4><p>Il 14 di Nisan si mangia ḥameṣ fino alla fine della 4ª ora (Ḥameṣ u-Maṣṣà 1:11 [10]); a 5 ore è vietato anche trarne beneficio, e va eliminato e annullato (1:9–10; 3:7); da mezzogiorno il divieto è della Torà (1:8). La ricerca si fa all’inizio della notte del 14 (2:3). Se il 14 cade di Shabbaṯ, la ricerca si fa il giovedì sera e il ḥameṣ si elimina prima dello Shabbaṯ, tranne quello da mangiare fino alle 4 ore (3:3).</p>
<h4>Neʿilà</h4><p>Non ha un orario: va conclusa poco prima del tramonto (Tefillà 3:6).</p>
<h4>Ṣeṯ ha-koḵaḇim</h4><p>Fine dello Shabbaṯ, delle feste e dei digiuni: 20 minuti fissi dopo il tramonto, «כמו שליש שעה אחר שקיעת החמה» (Terumoṯ 7:2; lo stesso intervallo in Qiddush ha-Ḥòḏesh 14:6). In alternativa 18 minuti: ¾ di mil, con il mil del Commento (Pesaḥim 3:2). <i>Impostazione: 20 / 18.</i></p>
<h4>ʿAloṯ ha-shàḥar</h4><p>Un’ora e un quinto di ore stagionali del giorno prima del sorgere del sole (Comm. Beraḵoṯ 1:1). Il MT usa l’alba come limite, ma non ne dà la distanza dal sorgere del sole. <i>Impostazione: mostra / nascondi.</i></p>
<h4>Accensione dei lumi di Shabbaṯ</h4><p>Non mostrata: il MT dice solo «מבעוד יום, קדם שקיעת החמה» (Shabbaṯ 5:3), senza minuti.</p>
<h4>Lumi di Ḥanukkà</h4><p>Al tramonto, e fino a circa mezz’ora dopo o poco più (Meḡillà wa-Ḥanukkà 4:5). Il venerdì prima del tramonto e all’uscita dello Shabbaṯ a ṣeṯ ha-koḵaḇim.</p>
<h4>Arrotondamento</h4><p>Con l’arrotondamento prudente i termini finali sono arrotondati al minuto precedente, gli inizi al minuto seguente; il sorgere del sole, che è l’uno e l’altro, al minuto più vicino, come tutti gli orari quando l’impostazione è spenta. Non è una regola del MT. <i>Impostazione: sì / no.</i></p>
<h4>Conto alla rovescia</h4><p>Sotto il prossimo orario del giorno l’app mostra il tempo che manca, al secondo. È riferito all’istante calcolato, mentre l’orario della riga è arrotondato al minuto: i due possono differire di meno di un minuto.</p>
<h3>Preghiera</h3>
<h4>Nefilaṯ appàyim</h4><p>Non si fa di Shabbaṯ, Yom Ṭoḇ e Ḥol ha-moʿeḏ, a Rosh ha-Shanà, Rosh Ḥòḏesh, Ḥanukkà e Purim, a Minḥà della vigilia di Shabbaṯ e di Yom Ṭoḇ, né a ʿArḇiṯ, benché alcuni singoli la facciano (Tefillà 5:16 [15]). A Yom ha-Kippurim si fa in ogni preghiera, e per questo ʿArḇiṯ compare solo quel giorno. Si fa anche il 9 di Aḇ e a Minḥà della vigilia di Kippur, che non è fra i sei «ימים טובים» di Sheḇiṯaṯ Yom Ṭoḇ 1:1. Le diciture del giorno segnalano gli usi diversi: a Kippur, secondo il rito italiano, solo a Neʿilà; il 9 di Aḇ, secondo il rito italiano, solo a Minḥà; a Minḥà della vigilia di Kippur e di Ḥanukkà alcuni la omettono; a Minḥà della vigilia di Rosh Ḥòḏesh la omette lo Shibbolé ha-Lèqeṭ.</p>
<h4>Pioggia</h4><p>Menzione nella seconda benedizione da Musaf di Sheminì ʿAṣèreṯ (del primo giorno, dove si fanno due giorni di Yom Ṭoḇ) a Shaḥriṯ del primo giorno di Pèsaḥ (Tefillà 2:17 [15], 2:19 [17]), con la formula del rito italiano «משיב הרוח ומוריד הגשם»; d’estate, secondo il rito italiano, non si dice nulla, mentre il MT ha «מוריד הטל». Richiesta in Birkaṯ ha-shanim: in Israele dal 7 di Marḥeshwan, nella diaspora dal 60° giorno dopo la tequfà di Tishrì (2:18 [16]), fino a Minḥà dell’ultimo giorno feriale prima del 15 Nisan; si comincia a ʿArḇiṯ della sera prima o, se quel giorno è Shabbaṯ, alla prima ʿArḇiṯ feriale seguente. La formula è quella del Maḥazor del curatore dell’app, del rito italiano originale: «ותן טל ומטר לברכה על פני האדמה ושבע את העולם מברכותיך». Le formule compaiono solo nei giorni in cui si dicono e la sera prima dell’inizio; nei giorni di cambio una nota dice quando si comincia o si smette.</p>
<h4>Tequfà</h4><p>Si usa il cap. 9 di Qiddush ha-Ḥòḏesh (anno di 365¼ giorni). Il cap. 10, detto «האמת יותר» (10:5 [6]), anticipa la richiesta della pioggia di circa 11 giorni. Entrambi i calcoli sono approssimati e seguono il moto medio del sole. <i>Impostazione: cap. 9 / cap. 10.</i></p>
<h4>Aggiunte alla ʿAmiḏà</h4><p>Da Rosh ha-Shanà a Yom ha-Kippurim «המלך הקדוש» e, nella ʿAmiḏà feriale, «המלך המשפט» (Tefillà 2:20 [18]); a Rosh Ḥòḏesh e Ḥol ha-moʿeḏ «יעלה ויבא» (2:12–13 [10–11]); a Ḥanukkà e Purim «על הנסים» (2:15 [13]); nei digiuni «עננו» e il 9 di Aḇ anche «רחם» (2:16 [14]). «עננו יי עננו» è la formula del rito italiano; «רחם יי אלהינו עלינו» è quella del MT, e secondo le fonti italiane si dice in ogni preghiera del 9 di Aḇ. La nota compare dalla vigilia («da ʿArḇiṯ di stasera») all’ultimo giorno («fino a Minḥà»). Le note che aprono o chiudono un cambio sono evidenziate.</p>
<h4>Benedizione della luna</h4><p>Si recita appena si vede la luna nuova, e fino al tramonto che chiude il 15 del mese (Beraḵoṯ 10:18–19 [16–17]); la nota compare la sera che apre il mese, la sera che apre il 15, e il giorno 15.</p>
<h3>Calendario</h3>
<h4>Digiuni</h4><p>Il 3 di Tishrì, il 10 di Ṭeḇeṯ, il 17 di Tammuz e il 9 di Aḇ, rinviati a domenica se cadono di Shabbaṯ; per uso il 13 di Aḏar, anticipato a giovedì 11 se cade di Shabbaṯ (Taʿaniyyoṯ 5:2–5), negli anni embolismici in Aḏar II, come la lettura della Meḡillà (Meḡillà 1:12). La nota del giorno indica la lettura della Torà (Tefillà 13:18); il 17 di Tammuz si segue il rito italiano, scostandosi dal MT, e si legge di seguito senza saltare. Il 9 di Aḇ comincia la sera prima (Taʿaniyyoṯ 5:7); ogni digiuno finisce all’uscita delle stelle.</p>
<h4>Conteggio del ʿÒmer</h4><p>Si contano di notte, dalla notte del 16 Nisan, i giorni insieme alle settimane (Temiḏin u-Musafin 7:19 [22]). La nota compare nel giorno civile la cui sera apre il giorno da contare. Se si dimentica un giorno, si contano i successivi con la benedizione (7:19 [23], 7:20 [25]).</p>
<h4>Parashiyyoṯ</h4><p>Lettura annuale (Tefillà 13:1), con i punti fissi di 13:2, calcolata con un algoritmo nostro e confrontata con Hebcal per gli anni 5600–6199: nessuna differenza. Quando Israele e diaspora leggono parashiyyoṯ diverse compare anche l’altra, con una nota sul motivo e sulla data in cui le letture si riallineano. I titoli in ebraico sono scritti come nel testo della Torà, con il maqqef e senza l’articolo che il versetto può avere (תולדת, לך־לך). Le hafṭaroṯ per ora non si mostrano.</p>
<h4>Le quattro parashiyyoṯ («sabati segnalati»)</h4><p>Nella scheda della parashà compare il nome dello Shabbaṯ: Sheqalim, Zaḵor, Parà e Ha-ḥòḏesh, secondo Tefillà 13:20; negli anni embolismici si conta da Aḏar II.</p>
<h4>Israele, secondo giorno di Yom Ṭoḇ, Purim</h4><p>Israele o diaspora si ricava dalla posizione (confine approssimativo). Purim è il 15 entro circa 6 km dalla Città Vecchia di Gerusalemme, altrimenti il 14. <i>Impostazioni: automatico / sì / no.</i></p>
<h4>Ricorrenze nazionali israeliane</h4><p>Yom ha-Zikkaron, Yom ha-ʿAṣmaʾuṯ e Yom Yerushalàyim sono segnalati, nelle date della legge israeliana, senza alcuna modifica alle preghiere né agli orari.</p>
<h4>Non segnati</h4><p>Lag la-ʿÒmer e altre ricorrenze senza fondamento; Ṭu bi-Shḇaṭ, Ṭu be-Aḇ, Pèsaḥ Shenì e Purim Qaṭan, che il MT nomina senza effetti sulla preghiera.</p>
<h3>Lingua e nomi</h3>
<h4>Lingue</h4><p>I termini ebraici compaiono sempre; le didascalie possono essere in italiano, inglese o francese, oppure si può scegliere il solo ebraico. Queste note seguono la lingua scelta; la versione completa è solo in italiano. <i>Impostazione: Italiano / English / Français / solo ebraico.</i></p>
<h4>Traslitterazione e grafia ebraica</h4><p>Nelle didascalie italiane l’accento segna la sillaba tonica solo dove non è quella attesa, come nell’ortografia italiana (Minḥà, Pèsaḥ); in inglese e francese le stesse forme senza accento. Per כ e ת si sceglie fra kh, th e <span class="fix">&#7733;, &#7791;</span>; per ב, a parte, fra <span class="fix">&#7687;</span> e v. Le scritte in ebraico seguono la grafia difettiva tradizionale (תפלה, צבור). <i>Impostazioni: kh, th / <span class="fix">&#7733;, &#7791;</span>; <span class="fix">&#7687;</span> / v.</i></p>
<h4>Nomi delle città</h4><p>I nomi delle città in ebraico seguono la grafia degli ebrei italiani (פאדובה, רומא), con le forme tradizionali dove esistono. Fuori d’Italia si scrive la pronuncia del luogo, non la sua grafia, secondo regole diverse per ogni lingua; dove non ci sono regole, e per i nomi inglesi, si parte dalla forma di Wikipedia in ebraico.</p>
<h4>Nome del luogo e fuso orario</h4><p>Con «Usa la mia posizione» l’app cerca la località più vicina, entro 50 km, in un elenco incluso nell’app (dati di GeoNames, licenza CC BY 4.0), senza mandare la posizione in rete. Il luogo segue la posizione del telefono e cambia oltre i 5 km di spostamento; si può cercare un altro luogo, per nome o per coordinate, per vederne gli orari e poi tornare alla propria posizione. La ricerca accetta anche la grafia israeliana dei nomi ebraici, e con la stella un luogo si aggiunge ai miei luoghi. La ricerca in rete su OpenStreetMap, che manda la posizione arrotondata a circa 1 km, è un’impostazione a parte, spenta in partenza. Per un luogo cercato si usa il suo fuso orario; con la posizione del telefono, quello del dispositivo. <i>Impostazioni: ricerca in rete sì / no; posizione automatica sì / no; i miei luoghi.</i></p>

<p>The app’s main choices, with their sources. The text of the Mishne Tora (MT) is that of mechon-mamre.org, which follows the Yemenite manuscripts; square brackets give the number of the halakha in the printed editions, where it differs. <b>Comm.</b> = the Rambam’s Commentary on the Mishna. Entries with a setting can be reversed. The full notes, with all the quotations, are on GitHub, in Italian only: <a href="https://github.com/arinohem/zemannim/blob/main/docs/note-sulle-scelte.md" target="_blank" rel="noopener">full version</a>.</p>
<h3>Times</h3>
<h4>Seasonal hours</h4><p>The day runs from sunrise to sunset and is divided into 12 hours (Tefilla 3:1, 3:4).</p>
<h4>Times of the day</h4><p>Morning Shemaʿ: until the end of the 3rd hour (Qeriʾaṯ Shemaʿ 1:12–14 [11–13]). Shaḥriṯ: until the end of the 4th (Tefilla 3:1). Musaf, on the days when it is said: until the end of the 7th hour; whoever prays later has fulfilled the obligation, though at fault, because its time is the whole day (3:5). Midday: the end of the 6th hour (3:1). Minḥa geḏola from 6½ hours, qeṭanna from 9½; Minḥa may be said until sunset (3:2, 3:4). Midnight: the preferable latest time for the evening Shemaʿ (Qeriʾaṯ Shemaʿ 1:10 [9]); the MT does not define it, and we calculate it halfway between sunset and sunrise.</p>
<h4>Ḥameṣ on the eve of Pesaḥ</h4><p>On 14 Nisan ḥameṣ is eaten until the end of the 4th hour (Ḥameṣ u-Maṣṣa 1:11 [10]); at 5 hours benefit from it is also forbidden, and it must be removed and annulled (1:9–10; 3:7); from midday the prohibition is from the Tora (1:8). The search is made at the beginning of the night of the 14th (2:3). If the 14th falls on Shabbaṯ, the search is made on Thursday evening, and the ḥameṣ is removed before Shabbaṯ, except what will be eaten until 4 hours (3:3).</p>
<h4>Neʿila</h4><p>It has no set time: it must be completed shortly before sunset (Tefilla 3:6).</p>
<h4>Ṣeṯ ha-koḵaḇim</h4><p>End of Shabbaṯ, festivals, and fasts: a fixed 20 minutes after sunset, “כמו שליש שעה אחר שקיעת החמה” (Terumoṯ 7:2; the same interval in Qiddush ha-Ḥoḏesh 14:6). Alternatively 18 minutes: ¾ of a mil, with the mil of the Commentary (Pesaḥim 3:2). <i>Setting: 20 / 18.</i></p>
<h4>ʿAloṯ ha-shaḥar</h4><p>One and one-fifth seasonal hours of the day before sunrise (Comm. Beraḵoṯ 1:1). The MT uses dawn as a limit, but does not give its distance from sunrise. <i>Setting: show / hide.</i></p>
<h4>Shabbaṯ candle lighting</h4><p>Not shown: the MT says only “מבעוד יום, קדם שקיעת החמה” (Shabbaṯ 5:3), without minutes.</p>
<h4>Ḥanukka lights</h4><p>At sunset, and until about half an hour later or a little more (Meḡilla wa-Ḥanukka 4:5). On Friday before sunset, and at the end of Shabbaṯ at ṣeṯ ha-koḵaḇim.</p>
<h4>Rounding</h4><p>With prudent rounding, latest times are rounded to the previous minute and starting times to the next minute; sunrise, which is both, to the nearest minute, as are all times when the setting is off. This is not a rule of the MT. <i>Setting: yes / no.</i></p>
<h4>Countdown</h4><p>Under the next time of the day the app shows the time remaining, to the second. It is counted to the computed instant, whereas the time in the row is rounded to the minute: the two may differ by less than a minute.</p>
<h3>Prayer</h3>
<h4>Nefilaṯ appayim</h4><p>It is not done on Shabbaṯ, Yom Ṭoḇ, and Ḥol ha-moʿeḏ, on Rosh ha-Shana, Rosh Ḥoḏesh, Ḥanukka, and Purim, at Minḥa on the eve of Shabbaṯ and of Yom Ṭoḇ, or at ʿArḇiṯ, although some individuals do it then (Tefilla 5:16 [15]). On Yom ha-Kippurim it is done at every prayer, which is why ʿArḇiṯ appears only on that day. It is also done on 9 Aḇ and at Minḥa on the eve of Kippur, which is not among the six “ימים טובים” of Sheḇiṯaṯ Yom Ṭoḇ 1:1. The day notes mention other customs: on Kippur, in the Italian rite, only at Neʿila; on 9 Aḇ, in the Italian rite, only at Minḥa; at Minḥa on the eve of Kippur and of Ḥanukka some omit it; at Minḥa on the eve of Rosh Ḥoḏesh the Shibbole ha-Leqeṭ omits it.</p>
<h4>Rain</h4><p>Mention in the second blessing from Musaf of Shemini ʿAṣereṯ (of its first day, where two days of Yom Ṭoḇ are kept) to Shaḥriṯ of the first day of Pesaḥ (Tefilla 2:17 [15], 2:19 [17]), with the formula of the Italian rite, “משיב הרוח ומוריד הגשם”; in summer, following the Italian rite, nothing is said, whereas the MT has “מוריד הטל”. Request in Birkaṯ ha-shanim: in Israel from 7 Marḥeshwan, in the diaspora from the 60th day after the tequfa of Tishri (2:18 [16]), until Minḥa of the last weekday before 15 Nisan; it begins at ʿArḇiṯ the evening before or, if that day is Shabbaṯ, at the first weekday ʿArḇiṯ after it. The formula is that of the Maḥazor of the app’s editor, in the original Italian rite: “ותן טל ומטר לברכה על פני האדמה ושבע את העולם מברכותיך”. The formulas appear only on the days when they are said and on the evening before they begin; on the days of change a note says when to begin or to stop.</p>
<h4>Tequfa</h4><p>Chapter 9 of Qiddush ha-Ḥoḏesh is used (a year of 365¼ days). Chapter 10, called “האמת יותר” (10:5 [6]), brings the request for rain forward by about 11 days. Both calculations are approximate and follow the mean motion of the sun. <i>Setting: ch. 9 / ch. 10.</i></p>
<h4>Additions to the ʿAmiḏa</h4><p>From Rosh ha-Shana to Yom ha-Kippurim “המלך הקדוש” and, in the weekday ʿAmiḏa, “המלך המשפט” (Tefilla 2:20 [18]); on Rosh Ḥoḏesh and Ḥol ha-moʿeḏ “יעלה ויבא” (2:12–13 [10–11]); on Ḥanukka and Purim “על הנסים” (2:15 [13]); on fasts “עננו” and on 9 Aḇ also “רחם” (2:16 [14]). “עננו יי עננו” is the formula of the Italian rite; “רחם יי אלהינו עלינו” is that of the MT, and according to the Italian sources it is said at every prayer of 9 Aḇ. The note appears from the eve (“From ʿArḇiṯ tonight”) to the last day (“Until Minḥa”). The notes that open or close a change are highlighted.</p>
<h4>Blessing on the moon</h4><p>It is said as soon as the new moon is seen, and until the sunset that closes the 15th of the month (Beraḵoṯ 10:18–19 [16–17]); the note appears on the evening that opens the month, on the evening that opens the 15th, and on the 15th.</p>
<h3>Calendar</h3>
<h4>Fasts</h4><p>3 Tishri, 10 Ṭeḇeṯ, 17 Tammuz, and 9 Aḇ, postponed to Sunday if they fall on Shabbaṯ; by custom 13 Aḏar, brought forward to Thursday the 11th if it falls on Shabbaṯ (Taʿaniyyoṯ 5:2–5), and in leap years kept in Aḏar II, like the reading of the Meḡilla (Meḡilla 1:12). The day’s note gives the Tora reading (Tefilla 13:18); on 17 Tammuz the Italian rite is followed, departing from the MT, and the passage is read straight through, without skipping. 9 Aḇ begins the evening before (Taʿaniyyoṯ 5:7); every fast ends when the stars come out.</p>
<h4>Counting the ʿOmer</h4><p>The days are counted together with the weeks, at night, from the night of 16 Nisan (Temiḏin u-Musafin 7:19 [22]). The note appears on the civil day whose evening opens the day to be counted. If a day is forgotten, the following days are counted with the blessing (7:19 [23], 7:20 [25]).</p>
<h4>Parashiyyoṯ</h4><p>Annual reading (Tefilla 13:1), with the fixed points of 13:2, calculated with our own algorithm and compared with Hebcal for the years 5600–6199: no differences. When Israel and the diaspora read different parashiyyoṯ, the other one is shown as well, with a note on the reason and on the date when the readings coincide again. The Hebrew titles are written as in the text of the Tora, with the maqqef and without the article that the verse may have (תולדת, לך־לך). The hafṭaroṯ are not shown for now.</p>
<h4>The four parashiyyoṯ</h4><p>The parasha card shows the name of the Shabbaṯ: Sheqalim, Zaḵor, Para, and Ha-ḥoḏesh, following Tefilla 13:20; in leap years they are counted from Aḏar II.</p>
<h4>Israel, second day of Yom Ṭoḇ, Purim</h4><p>Israel or diaspora is determined from the location (approximate border). Purim is on the 15th within about 6 km of the Old City of Jerusalem, otherwise on the 14th. <i>Settings: automatic / yes / no.</i></p>
<h4>Israeli national days</h4><p>Yom ha-Zikkaron, Yom ha-ʿAṣmaʾuṯ, and Yom Yerushalayim are marked, on the dates set by Israeli law, with no change to the prayers or the times.</p>
<h4>Not marked</h4><p>Lag la-ʿOmer and other observances without foundation; Ṭu bi-Shḇaṭ, Ṭu be-Aḇ, Pesaḥ Sheni, and Purim Qaṭan, which the MT mentions without any effect on prayer.</p>
<h3>Language and names</h3>
<h4>Languages</h4><p>The Hebrew terms are always shown; the captions can be in Italian, English, or French, or Hebrew alone can be chosen. These notes follow the language chosen; the full version is in Italian only. <i>Setting: Italiano / English / Français / Hebrew only.</i></p>
<h4>Romanization and Hebrew spelling</h4><p>In the Italian captions an accent marks the stressed syllable only where it is not the one expected, as in Italian spelling (Minḥà, Pèsaḥ); English and French have the same forms without the accent. For כ and ת the choice is between kh, th and <span class="fix">&#7733;, &#7791;</span>; for ב, separately, between <span class="fix">&#7687;</span> and v. Hebrew text follows the traditional defective spelling (תפלה, צבור). <i>Settings: kh, th / <span class="fix">&#7733;, &#7791;</span>; <span class="fix">&#7687;</span> / v.</i></p>
<h4>Names of towns</h4><p>Town names in Hebrew follow the spelling of Italian Jews (פאדובה, רומא), with the traditional forms where they exist. Outside Italy the local pronunciation is written, not the spelling, by rules that differ for each language; where there are no rules, and for English names, the starting point is the form in the Hebrew Wikipedia.</p>
<h4>Place name and time zone</h4><p>With “Use my location” the app looks for the nearest place, within 50 km, in a list built into the app (GeoNames data, CC BY 4.0 licence), without sending the location over the network. The place follows the phone’s location and changes after a move of more than 5 km; another place can be searched for, by name or by coordinates, to see its times, before going back to one’s own location. The search also accepts the Israeli spelling of Hebrew names, and the star adds a place to my places. The online lookup on OpenStreetMap, which sends the location rounded to about 1 km, is a separate setting, off by default. For a place searched for, its own time zone is used; with the phone’s location, the device’s. <i>Settings: online lookup yes / no; automatic location yes / no; my places.</i></p>
<h3>App</h3>
<h4>Installation</h4><p>In Settings, the “Installation” item explains how to add the app to the Home Screen, on iPhone and on Android; when the app is already installed, the item does not appear.</p>

<p>Les principaux choix de l’app, avec leur source. Le texte du Mishne Tora (MT) est celui de mechon-mamre.org, qui suit les manuscrits yéménites&nbsp;; entre crochets, le numéro de la halakha dans les éditions imprimées, là où il diffère. <b>Comm.</b> = Commentaire de la Mishna du Rambam. Les entrées assorties d’un réglage peuvent être inversées. Les notes complètes, avec toutes les citations, sont sur GitHub, en italien seulement&nbsp;: <a href="https://github.com/arinohem/zemannim/blob/main/docs/note-sulle-scelte.md" target="_blank" rel="noopener">version complète</a>.</p>
<h3>Horaires</h3>
<h4>Heures saisonnières</h4><p>Le jour va du lever au coucher du soleil et se divise en 12 heures (Tefilla 3:1, 3:4).</p>
<h4>Horaires de la journée</h4><p>Shemaʿ du matin&nbsp;: jusqu’à la fin de la 3<sup>e</sup> heure (Qeriʾaṯ Shemaʿ 1:12–14 [11–13]). Shaḥriṯ&nbsp;: jusqu’à la fin de la 4<sup>e</sup> (Tefilla 3:1). Musaf, les jours où on le dit&nbsp;: jusqu’à la fin de la 7<sup>e</sup> heure&nbsp;; qui prie plus tard est quitte, bien qu’en faute, car son temps est toute la journée (3:5). Midi&nbsp;: fin de la 6<sup>e</sup> heure (3:1). Minḥa geḏola à partir de 6&nbsp;heures&nbsp;½, qeṭanna à partir de 9&nbsp;heures&nbsp;½&nbsp;; on peut dire Minḥa jusqu’au coucher du soleil (3:2, 3:4). Minuit&nbsp;: heure limite préférable pour le Shemaʿ du soir (Qeriʾaṯ Shemaʿ 1:10 [9])&nbsp;; le MT ne le définit pas, et nous le calculons à mi-chemin entre le coucher et le lever du soleil.</p>
<h4>Ḥameṣ la veille de Pesaḥ</h4><p>Le 14 Nisan, on mange du ḥameṣ jusqu’à la fin de la 4<sup>e</sup> heure (Ḥameṣ u-Maṣṣa 1:11 [10])&nbsp;; à 5 heures il est aussi interdit d’en tirer profit, et il faut l’éliminer et l’annuler (1:9–10&nbsp;; 3:7)&nbsp;; à partir de midi l’interdiction est de la Tora (1:8). La recherche se fait au début de la nuit du 14 (2:3). Si le 14 tombe un Shabbaṯ, la recherche se fait le jeudi soir et l’on élimine le ḥameṣ avant le Shabbaṯ, sauf celui que l’on mangera jusqu’à 4 heures (3:3).</p>
<h4>Neʿila</h4><p>Elle n’a pas d’horaire&nbsp;: elle doit s’achever peu avant le coucher du soleil (Tefilla 3:6).</p>
<h4>Ṣeṯ ha-koḵaḇim</h4><p>Fin du Shabbaṯ, des fêtes et des jeûnes&nbsp;: 20 minutes fixes après le coucher du soleil, «&nbsp;כמו שליש שעה אחר שקיעת החמה&nbsp;» (Terumoṯ 7:2&nbsp;; le même intervalle dans Qiddush ha-Ḥoḏesh 14:6). Ou bien 18 minutes&nbsp;: ¾ de mil, avec le mil du Commentaire (Pesaḥim 3:2). <i>Réglage&nbsp;: 20 / 18.</i></p>
<h4>ʿAloṯ ha-shaḥar</h4><p>Une heure et un cinquième, en heures saisonnières du jour, avant le lever du soleil (Comm. Beraḵoṯ 1:1). Le MT se sert de l’aube comme limite, mais n’en donne pas la distance par rapport au lever du soleil. <i>Réglage&nbsp;: afficher / masquer.</i></p>
<h4>Allumage des lumières du Shabbaṯ</h4><p>Non affiché&nbsp;: le MT dit seulement «&nbsp;מבעוד יום, קדם שקיעת החמה&nbsp;» (Shabbaṯ 5:3), sans minutes.</p>
<h4>Lumières de Ḥanukka</h4><p>Au coucher du soleil, et jusqu’à environ une demi-heure après ou un peu plus (Meḡilla wa-Ḥanukka 4:5). Le vendredi avant le coucher du soleil, et à la sortie du Shabbaṯ à ṣeṯ ha-koḵaḇim.</p>
<h4>Arrondi</h4><p>Avec l’arrondi prudent, les heures limites sont arrondies à la minute précédente, les débuts à la minute suivante&nbsp;; le lever du soleil, qui est l’un et l’autre, à la minute la plus proche, comme toutes les heures lorsque le réglage est désactivé. Ce n’est pas une règle du MT. <i>Réglage&nbsp;: oui / non.</i></p>
<h4>Compte à rebours</h4><p>Sous la prochaine heure du jour, l’application indique le temps restant, à la seconde. Il se rapporte à l’instant calculé, alors que l’heure de la ligne est arrondie à la minute&nbsp;: l’écart entre les deux est inférieur à une minute.</p>
<h3>Prière</h3>
<h4>Nefilaṯ appayim</h4><p>On ne la fait pas le Shabbaṯ, à Yom Ṭoḇ et à Ḥol ha-moʿeḏ, à Rosh ha-Shana, Rosh Ḥoḏesh, Ḥanukka et Purim, à Minḥa la veille du Shabbaṯ et de Yom Ṭoḇ, ni à ʿArḇiṯ, bien que certains particuliers la fassent (Tefilla 5:16 [15]). À Yom ha-Kippurim on la fait à chaque prière, et c’est pourquoi ʿArḇiṯ n’apparaît que ce jour-là. On la fait aussi le 9 Aḇ et à Minḥa la veille de Kippur, qui n’est pas l’un des six «&nbsp;ימים טובים&nbsp;» de Sheḇiṯaṯ Yom Ṭoḇ 1:1. Les mentions du jour signalent les autres usages&nbsp;: à Kippur, selon le rite italien, seulement à la Neʿila&nbsp;; le 9 Aḇ, selon le rite italien, seulement à Minḥa&nbsp;; à Minḥa la veille de Kippur et de Ḥanukka, certains l’omettent&nbsp;; à Minḥa la veille de Rosh Ḥoḏesh, le Shibbole ha-Leqeṭ l’omet.</p>
<h4>Pluie</h4><p>Mention dans la deuxième bénédiction, de Musaf de Shemini ʿAṣereṯ (du premier jour, là où l’on fait deux jours de Yom Ṭoḇ) à Shaḥriṯ du premier jour de Pesaḥ (Tefilla 2:17 [15], 2:19 [17]), avec la formule du rite italien «&nbsp;משיב הרוח ומוריד הגשם&nbsp;»&nbsp;; en été, selon le rite italien, on ne dit rien, alors que le MT a «&nbsp;מוריד הטל&nbsp;». Demande dans Birkaṯ ha-shanim&nbsp;: en Israël à partir du 7 Marḥeshwan, en diaspora à partir du 60<sup>e</sup> jour après la tequfa de Tishri (2:18 [16]), jusqu’à Minḥa du dernier jour de semaine avant le 15 Nisan&nbsp;; on commence à ʿArḇiṯ la veille au soir ou, si ce jour est un Shabbaṯ, au premier office de ʿArḇiṯ de semaine qui suit. La formule est celle du Maḥazor de l’éditeur de l’app, du rite italien d’origine&nbsp;: «&nbsp;ותן טל ומטר לברכה על פני האדמה ושבע את העולם מברכותיך&nbsp;». Les formules n’apparaissent que les jours où on les dit et la veille au soir de leur début&nbsp;; les jours de changement, une note dit quand on commence ou quand on cesse.</p>
<h4>Tequfa</h4><p>On suit le chap. 9 de Qiddush ha-Ḥoḏesh (année de 365&nbsp;jours&nbsp;¼). Le chap. 10, dit «&nbsp;האמת יותר&nbsp;» (10:5 [6]), avance la demande de la pluie d’environ 11 jours. Les deux calculs sont approximatifs et suivent le mouvement moyen du soleil. <i>Réglage&nbsp;: chap. 9 / chap. 10.</i></p>
<h4>Ajouts à la ʿAmiḏa</h4><p>De Rosh ha-Shana à Yom ha-Kippurim, «&nbsp;המלך הקדוש&nbsp;» et, dans la ʿAmiḏa de semaine, «&nbsp;המלך המשפט&nbsp;» (Tefilla 2:20 [18])&nbsp;; à Rosh Ḥoḏesh et à Ḥol ha-moʿeḏ, «&nbsp;יעלה ויבא&nbsp;» (2:12–13 [10–11])&nbsp;; à Ḥanukka et à Purim, «&nbsp;על הנסים&nbsp;» (2:15 [13])&nbsp;; les jours de jeûne, «&nbsp;עננו&nbsp;» et, le 9 Aḇ, aussi «&nbsp;רחם&nbsp;» (2:16 [14]). «&nbsp;עננו יי עננו&nbsp;» est la formule du rite italien&nbsp;; «&nbsp;רחם יי אלהינו עלינו&nbsp;» est celle du MT et, selon les sources italiennes, on la dit à chaque prière du 9 Aḇ. La note apparaît de la veille («&nbsp;À partir de ʿArḇiṯ ce soir&nbsp;») au dernier jour («&nbsp;Jusqu’à Minḥa&nbsp;»). Les notes qui ouvrent ou closent un changement sont mises en évidence.</p>
<h4>Bénédiction de la lune</h4><p>On la récite dès que l’on voit la nouvelle lune, et jusqu’au coucher du soleil qui clôt le 15 du mois (Beraḵoṯ 10:18–19 [16–17])&nbsp;; la note apparaît le soir qui ouvre le mois, le soir qui ouvre le 15, et le 15.</p>
<h3>Calendrier</h3>
<h4>Jeûnes</h4><p>Le 3 Tishri, le 10 Ṭeḇeṯ, le 17 Tammuz et le 9 Aḇ, reportés au dimanche s’ils tombent un Shabbaṯ&nbsp;; par coutume le 13 Aḏar, avancé au jeudi 11 s’il tombe un Shabbaṯ (Taʿaniyyoṯ 5:2–5), et, les années embolismiques, en Aḏar II, comme la lecture de la Meḡilla (Meḡilla 1:12). La note du jour indique la lecture de la Tora (Tefilla 13:18)&nbsp;; le 17 Tammuz on suit le rite italien, en s’écartant du MT, et on lit à la suite, sans sauter. Le 9 Aḇ commence la veille au soir (Taʿaniyyoṯ 5:7)&nbsp;; chaque jeûne finit à la sortie des étoiles.</p>
<h4>Compte du ʿOmer</h4><p>On compte la nuit, à partir de la nuit du 16 Nisan, les jours avec les semaines (Temiḏin u-Musafin 7:19 [22]). La note apparaît le jour civil dont le soir ouvre le jour à compter. Si l’on oublie un jour, on compte les suivants avec la bénédiction (7:19 [23], 7:20 [25]).</p>
<h4>Parashiyyoṯ</h4><p>Lecture annuelle (Tefilla 13:1), avec les points fixes de 13:2, calculée par un algorithme propre et comparée à Hebcal pour les années 5600–6199&nbsp;: aucune différence. Quand Israël et la diaspora lisent des parashiyyoṯ différentes, l’autre apparaît aussi, avec une note sur la raison et sur la date à laquelle les lectures coïncident de nouveau. Les titres en hébreu sont écrits comme dans le texte de la Tora, avec le maqqef et sans l’article que le verset peut avoir (תולדת, לך־לך). Les hafṭaroṯ ne sont pas affichées pour l’instant.</p>
<h4>Les quatre parashiyyoṯ</h4><p>La fiche de la parasha indique le nom du Shabbaṯ&nbsp;: Sheqalim, Zaḵor, Para et Ha-ḥoḏesh, selon Tefilla 13:20&nbsp;; les années embolismiques, on compte à partir d’Aḏar II.</p>
<h4>Israël, deuxième jour de Yom Ṭoḇ, Purim</h4><p>Israël ou diaspora&nbsp;: déterminé d’après la position (frontière approximative). Purim est le 15 à moins de 6 km environ de la Vieille Ville de Jérusalem, sinon le 14. <i>Réglages&nbsp;: automatique / oui / non.</i></p>
<h4>Journées nationales israéliennes</h4><p>Yom ha-Zikkaron, Yom ha-ʿAṣmaʾuṯ et Yom Yerushalayim sont signalés, aux dates de la loi israélienne, sans aucune modification des prières ni des horaires.</p>
<h4>Non signalés</h4><p>Lag la-ʿOmer et d’autres célébrations sans fondement&nbsp;; Ṭu bi-Shḇaṭ, Ṭu be-Aḇ, Pesaḥ Sheni et Purim Qaṭan, que le MT mentionne sans effet sur la prière.</p>
<h3>Langue et noms</h3>
<h4>Langues</h4><p>Les termes hébreux apparaissent toujours&nbsp;; les légendes peuvent être en italien, en anglais ou en français, ou bien on peut choisir l’hébreu seul. Ces notes suivent la langue choisie&nbsp;; la version complète n’existe qu’en italien. <i>Réglage&nbsp;: Italiano / English / Français / hébreu seul.</i></p>
<h4>Translittération et graphie hébraïque</h4><p>Dans les légendes italiennes, l’accent marque la syllabe tonique seulement là où elle n’est pas celle qu’on attend, comme dans l’orthographe italienne (Minḥà, Pèsaḥ)&nbsp;; en anglais et en français, les mêmes formes sans accent. Pour כ et ת on choisit entre kh, th et <span class="fix">&#7733;, &#7791;</span>&nbsp;; pour ב, à part, entre <span class="fix">&#7687;</span> et v. Les textes en hébreu suivent la graphie défective traditionnelle (תפלה, צבור). <i>Réglages&nbsp;: kh, th / <span class="fix">&#7733;, &#7791;</span>&nbsp;; <span class="fix">&#7687;</span> / v.</i></p>
<h4>Noms des villes</h4><p>Les noms des villes en hébreu suivent la graphie des juifs italiens (פאדובה, רומא), avec les formes traditionnelles là où elles existent. Hors d’Italie on écrit la prononciation du lieu, non sa graphie, selon des règles propres à chaque langue&nbsp;; là où il n’y a pas de règles, et pour les noms anglais, on part de la forme de Wikipédia en hébreu.</p>
<h4>Nom du lieu et fuseau horaire</h4><p>Avec «&nbsp;Utiliser ma position&nbsp;», l’app cherche la localité la plus proche, dans un rayon de 50 km, dans une liste intégrée à l’app (données de GeoNames, licence CC BY 4.0), sans envoyer la position en ligne. Le lieu suit la position du téléphone et change après un déplacement de plus de 5 km&nbsp;; on peut chercher un autre lieu, par son nom ou par ses coordonnées, pour en voir les heures, puis revenir à sa position. La recherche accepte aussi la graphie israélienne des noms hébreux, et l’étoile ajoute un lieu à mes lieux. La recherche en ligne sur OpenStreetMap, qui envoie la position arrondie à 1 km environ, est un réglage à part, désactivé au départ. Pour un lieu recherché on utilise son propre fuseau horaire&nbsp;; avec la position du téléphone, celui de l’appareil. <i>Réglages&nbsp;: recherche en ligne oui / non&nbsp;; position automatique oui / non&nbsp;; mes lieux.</i></p>

<p>עיקרי ההכרעות שביישום ומקורותיהן. נוסח משנה תורה הוא נוסח mechon-mamre.org, ההולך אחר כתבי היד התימניים; בסוגריים מרובעים מספר ההלכה שבדפוסים, במקום שהוא שונה. <b>פיה״מ</b> = פירוש המשנה לרמב״ם. סעיף שיש בו הגדרה, אפשר להפכו. ההערות המלאות, עם כל המובאות, נמצאות ב־GitHub, באיטלקית בלבד: <a href="https://github.com/arinohem/zemannim/blob/main/docs/note-sulle-scelte.md" target="_blank" rel="noopener">הנוסח המלא</a>.</p>
<h3>זמנים</h3>
<h4>שעות זמניות</h4><p>היום הוא מהנץ החמה עד שקיעתה, ונחלק לשתים עשרה שעות (תפלה ג, א; ג, ד).</p>
<h4>זמני היום</h4><p>קריאת שמע של שחרית: עד סוף שעה שלישית (קריאת שמע א, יב–יד [יא–יג]). תפלת השחר: עד סוף שעה רביעית (תפלה ג, א). מוסף, ביום שיש בו מוסף: עד סוף שעה שביעית; והמתפלל אחר שבע שעות, «אף על פי שפשע, יצא ידי חובתו, מפני שזמנה כל היום» (ג, ה). חצות היום: סוף שעה ששית (ג, א). מנחה גדולה משש שעות ומחצה, ומנחה קטנה מתשע שעות ומחצה; ומתפללים מנחה עד שתשקע החמה (ג, ב; ג, ד). חצות הלילה: סוף זמן קריאת שמע של ערבית לכתחלה (קריאת שמע א, י [ט]); לא נתפרש במשנה תורה כיצד מחשבים אותה, ואנו מחשבים אותה באמצע שבין שקיעת החמה להנץ החמה.</p>
<h4>חמץ ביום ארבעה עשר</h4><p>ביום ארבעה עשר בניסן אוכלים חמץ עד סוף שעה רביעית (חמץ ומצה א, יא [י]); מתחלת שעה ששית הוא אסור גם בהניה, ומבערים ומבטלים אותו קדם לכן (א, ט–י; ג, ז); מחצות היום ולמעלה אסור מן התורה (א, ח). בודקים את החמץ מתחלת ליל ארבעה עשר (ב, ג). חל ארבעה עשר להיות בשבת, בודקים בליל ערב שבת ומבערים את החמץ מלפני השבת, חוץ ממה שאוכלים עד ארבע שעות (ג, ג).</p>
<h4>נעילה</h4><p>אין לה שעה קבועה: משלימים אותה סמוך לשקיעת החמה (תפלה ג, ו).</p>
<h4>צאת הכוכבים</h4><p>מוצאי שבת וימים טובים וסוף התעניות: עשרים דקות קבועות אחר שקיעת החמה, «כמו שליש שעה אחר שקיעת החמה» (תרומות ז, ב; וכן השעור בקדוש החדש יד, ו). ואפשר לבחור שמונה עשרה דקות: שלשת רבעי מיל, לפי שעור המיל שבפירוש המשנה (פסחים ג, ב). <i>הגדרה: 20 / 18.</i></p>
<h4>עלות השחר</h4><p>שעה וחומש, משעות היום הזמניות, קודם הנץ החמה (פיה״מ ברכות א, א). במשנה תורה עלות השחר משמש גבול, אבל לא נאמר שם כמה יש בינו לבין הנץ החמה. <i>הגדרה: להציג / להסתיר.</i></p>
<h4>הדלקת נר שבת</h4><p>אינה מוצגת: במשנה תורה נאמר רק «מבעוד יום, קדם שקיעת החמה» (שבת ה, ג), בלא שעור דקות.</p>
<h4>נרות חנכה</h4><p>עם שקיעת החמה, ועד כמו חצי שעה אחריה או יתר מעט (מגלה וחנכה ד, ה). בערב שבת קדם שקיעת החמה, ובמוצאי שבת בצאת הכוכבים.</p>
<h4>עיגול</h4><p>בעיגול לחומרא, סוף זמן מתעגל לדקה שלפניו ותחלת זמן לדקה שלאחריה; הנץ החמה, שהוא גם זה וגם זה, לדקה הקרובה, וכן כל הזמנים כשההגדרה כבויה. אין זה דין ממשנה תורה. <i>הגדרה: כן / לא.</i></p>
<h4>ספירה לאחור</h4><p>מתחת לזמן הבא של היום היישום מציג את הזמן שנותר, בשניות. הספירה היא לרגע המחושב, ואילו הזמן שבשורה מעוגל לדקה: ההפרש ביניהם פחות מדקה.</p>
<h3>תפלה</h3>
<h4>נפילת אפים</h4><p>אין נופלים על פניהם בשבת, ביום טוב ובחול המועד, בראש השנה, בראש חדש, בחנכה ובפורים, ולא במנחה של ערב שבת ושל ערב יום טוב, ולא בערבית, אף על פי שיש יחידים שנופלים בה (תפלה ה, טז [טו]). ביום הכפורים נופלים בכל תפלה ותפלה, ולפיכך ערבית נזכרת ביום זה בלבד. ונופלים גם בתשעה באב ובמנחה של ערב יום הכפורים, שאינו בכלל ששת ה«ימים טובים» שבשביתת יום טוב א, א. ובהערות היום נזכרים המנהגים האחרים: ביום הכפורים, במנהג ק״ק איטאליאני, בנעילה בלבד; בתשעה באב, במנהג ק״ק איטאליאני, במנחה בלבד; במנחה של ערב יום הכפורים ושל ערב חנכה יש שאין נופלים; ובמנחה של ערב ראש חדש אין נופלים לדעת שבלי הלקט.</p>
<h4>גשמים</h4><p>מזכירים גבורות גשמים בברכה שניה ממוסף של שמיני עצרת (ובמקום שעושים שני ימים טובים, ממוסף של יום ראשון) עד שחרית של יום טוב ראשון של פסח (תפלה ב, יז [טו]; ב, יט [יז]), בנוסח מנהג ק״ק איטאליאני «משיב הרוח ומוריד הגשם»; בימות החמה אין אומרים כלום, כמנהג ק״ק איטאליאני, ובמשנה תורה «מוריד הטל». שאלת גשמים בברכת השנים: בארץ ישראל משבעה במרחשון, ובחוץ לארץ מיום ששים אחר תקופת תשרי (ב, יח [טז]), עד מנחה של יום החול האחרון שלפני חמשה עשר בניסן; ומתחילים מערבית של ליל אותו יום, ואם חל בשבת, מערבית הראשונה של חול שלאחריה. הנוסח הוא נוסח המחזור של עורך היישום, כמנהג ק״ק איטאליאני המקורי: «ותן טל ומטר לברכה על פני האדמה ושבע את העולם מברכותיך». הנוסחאות מוצגות רק בימים שאומרים אותן וביום שלפני תחלתן; וביום שהדין משתנה בו, הערה מודיעה מתי מתחילים ומתי פוסקים.</p>
<h4>תקופה</h4><p>החשבון הוא לפי פרק ט מהלכות קדוש החדש (שנה של 365 יום ורביע). החשבון שבפרק י, שנאמר עליו «האמת יותר» (י, ה [ו]), מקדים את שאלת הגשמים בכאחד עשר יום. שני החשבונות בקירוב, והם הולכים אחר מהלך השמש האמצעי. <i>הגדרה: פרק ט / פרק י.</i></p>
<h4>תוספות בתפלה (עמידה)</h4><p>מראש השנה עד יום הכפורים «המלך הקדוש», ובתפלת החול גם «המלך המשפט» (תפלה ב, כ [יח]); בראש חדש ובחול המועד «יעלה ויבא» (ב, יב–יג [י–יא]); בחנכה ובפורים «על הנסים» (ב, טו [יג]); בתעניות «עננו», ובתשעה באב גם «רחם» (ב, טז [יד]). «עננו יי עננו» הוא נוסח מנהג ק״ק איטאליאני; «רחם יי אלהינו עלינו» הוא נוסח משנה תורה, ולפי המקורות האיטלקיים אומרים אותו בכל תפלות תשעה באב. ההערה מוצגת מערב היום («מערבית של הלילה») עד היום האחרון («עד מנחה»). הערות הפותחות או החותמות שנוי מודגשות.</p>
<h4>ברכת הלבנה</h4><p>מברכים כשרואים את הלבנה בחדושה, ועד שקיעת החמה של חמשה עשר בחדש (ברכות י, יח–יט [טז–יז]); ההערה מופיעה בלילה שפותח את החדש, בלילה שפותח את יום חמשה עשר, וביום חמשה עשר.</p>
<h3>לוח השנה</h3>
<h4>תעניות</h4><p>שלשה בתשרי, עשרה בטבת, שבעה עשר בתמוז ותשעה באב; ואם חל אחד מהן בשבת, דוחים אותו לאחר השבת. ונהגו להתענות בשלשה עשר באדר, ואם חל בשבת מקדימים ליום חמישי, אחד עשר בו (תעניות ה, ב–ה); ובשנה מעוברת באדר שני, כקריאת המגלה (מגלה א, יב). בהערת היום נזכרת קריאת התורה (תפלה יג, יח); בשבעה עשר בתמוז הולכים אחר מנהג ק״ק איטאליאני, שלא כמשנה תורה, וקוראים הכל על הסדר ואין מדלגים. תשעה באב מתחיל מבערב (תעניות ה, ז); וכל תענית סופה בצאת הכוכבים.</p>
<h4>ספירת העמר</h4><p>מונים בלילה, מליל ששה עשר בניסן, את הימים עם השבועות (תמידין ומוספין ז, יט [כב]). ההערה מוצגת ביום האזרחי שבערבו מתחיל היום הנמנה. מי ששכח יום אחד, מונה את הימים שאחריו בברכה (ז, יט [כג]; ז, כ [כה]).</p>
<h4>פרשיות</h4><p>קריאה שמשלימים בה את התורה בשנה אחת (תפלה יג, א), עם הזמנים הקבועים שבהלכה יג, ב; חשבנוה באלגוריתם משלנו והשוינוה ל־Hebcal לשנים 5600–6199, ולא נמצא הפרש. כשקורים בארץ ישראל ובחוץ לארץ פרשיות שונות, מוצגת גם האחרת, ועמה הערה על הטעם ועל היום שבו הקריאה חוזרת להיות שוה. שמות הפרשיות כתובים ככתוב בתורה, במקף ובלא ה״א הידיעה שבפסוק (תולדת, לך־לך). ההפטרות אינן מוצגות לפי שעה.</p>
<h4>ארבע פרשיות</h4><p>בכרטיס הפרשה נזכר שם השבת: שקלים, זכור, פרה והחדש, כאמור בתפלה יג, כ; ובשנה מעוברת מונים מאדר שני.</p>
<h4>ארץ ישראל, יום טוב שני, פורים</h4><p>ארץ ישראל או חוץ לארץ נקבע לפי המיקום (הגבול בקירוב). פורים בחמשה עשר בתוך כששה קילומטרים מן העיר העתיקה שבירושלים, ובשאר המקומות בארבעה עשר. <i>הגדרות: אוטומטי / כן / לא.</i></p>
<h4>ימים לאומיים של מדינת ישראל</h4><p>יום הזכרון, יום העצמאות ויום ירושלים נזכרים בתאריכים שנקבעו בחוק הישראלי, ואין בהם שום שנוי בתפלות ובזמנים.</p>
<h4>ימים שאינם נזכרים</h4><p>ל״ג לעמר ושאר ימים שאין להם יסוד; ט״ו בשבט, ט״ו באב, פסח שני ופורים קטן, שמשנה תורה מזכירם ואין בהם שנוי בתפלה.</p>
<h3>לשון ושמות</h3>
<h4>שפות</h4><p>המונחים העבריים מוצגים תמיד; הכתוביות אפשר שיהיו באיטלקית, באנגלית או בצרפתית, ואפשר לבחור עברית בלבד. הערות אלו מוצגות בשפה שנבחרה; הנוסח המלא הוא באיטלקית בלבד. <i>הגדרה: Italiano / English / Français / עברית בלבד.</i></p>
<h4>תעתיק וכתיב עברי</h4><p>בכתוביות האיטלקיות הטעם מסומן רק במקום שאינו כצפוי, כדרך הכתיב האיטלקי (Minḥà, Pèsaḥ); באנגלית ובצרפתית אותן הצורות בלא סימן הטעם. לכ״ף ולתי״ו הרפויות בוחרים בין kh, th ובין <span class="fix">&#7733;, &#7791;</span>; ולבי״ת הרפויה, בנפרד, בין <span class="fix">&#7687;</span> ובין v. הכתוב בעברית הוא בכתיב החסר המסורתי (תפלה, צבור). <i>הגדרות: <span dir="ltr">kh, th / <span class="fix">&#7733;, &#7791;</span>; <span class="fix">&#7687;</span> / v</span>.</i></p>
<h4>שמות הערים</h4><p>שמות הערים בעברית כתובים בכתיב יהודי איטליה (פאדובה, רומא), ובצורות המסורתיות במקום שישנן. חוץ לאיטליה כותבים את מבטא המקום ולא את כתיבו, לפי כללים שונים לכל לשון; ובמקום שאין כללים, וכן בשמות האנגליים, היסוד הוא הצורה שבוויקיפדיה העברית.</p>
<h4>שם המקום ואזור הזמן</h4><p>ב«השתמש במיקום שלי» היישום מחפש את היישוב הקרוב ביותר, עד חמשים קילומטר, ברשימה שבתוך היישום (נתוני GeoNames, רשיון <span dir="ltr">CC BY 4.0</span>), ואינו שולח את המיקום לרשת. המקום נקבע לפי מיקום הטלפון ומשתנה כשמתרחקים יותר מחמשה קילומטרים; אפשר לחפש מקום אחר, לפי שמו או לפי קואורדינטות, כדי לראות את זמניו, ולחזור אחר כך למיקום. החיפוש מקבל גם את הכתיב הישראלי של השמות, ובכוכב מוסיפים מקום למקומות שלי. החיפוש ברשת ב־OpenStreetMap, השולח את המיקום בעיגול לכקילומטר, הוא הגדרה בפני עצמה, והיא כבויה מתחלה. למקום שמחפשים אזור הזמן הוא שלו; ולפי מיקום הטלפון, של המכשיר. <i>הגדרות: חיפוש ברשת כן / לא; מיקום אוטומטי כן / לא; המקומות שלי.</i></p>
<h3>היישום</h3>
<h4>התקנה</h4><p>בהגדרות, הסעיף «התקנה» מסביר כיצד מוסיפים את היישום למסך הבית, ב־iPhone וב־Android; וכשהיישום כבר מותקן, הסעיף אינו מוצג.</p>
