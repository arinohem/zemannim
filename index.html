<p>Ogni regola dell’app, con la fonte e lo stato. <b>MT</b> = letto nel Mishné Torà (testo di mechon-mamre.org); <b>Comm.</b> = Commento alla Mishnà del Rambam; <b>verificato</b> = confrontato con un’altra fonte di calcolo; <b>rito italiano</b> = secondo i testimoni del rito italiano; <b>dedotto</b> = conclusione nostra; <b>scelta</b> = decisione dell’utente. Le voci con un’impostazione si possono invertire.</p>
<h4>Ore stagionali <span class="st">dedotto</span></h4><p>Il giorno va dal sorgere al tramonto, diviso in 12 ore. La quarta ora finisce a «שליש היום» (Tefillà 3:1); la preghiera comincia «עם הנץ החמה» (3:1) e si può recitare Minḥà «עד שתשקע החמה» (3:4).</p>
<h4>Ṣeṯ ha-koḵaḇim: fine dello Shabbaṯ, delle feste e dei digiuni <span class="st">MT · scelta</span></h4><p>20 minuti fissi dopo il tramonto: «וזה העת כמו שליש שעה אחר שקיעת החמה» (Terumoṯ 7:2). In alternativa 18 minuti: ¾ di mil, con il mil di «שני חומשי שעה משעות ההשויה» (Comm. Pesaḥim 3:2). Non abbiamo trovato il passo in cui il Rambam stesso enuncia i ¾ di mil; Shabbaṯ 5:4 parla solo di tre stelle medie. <i>Impostazione: 20 / 18.</i></p>
<h4>ʿAloṯ ha-shàḥar <span class="st">Comm. · scelta</span></h4><p>Il MT usa l’alba come limite (Qeriʾaṯ Shemaʿ 1:10–13; Tefillà 3:6–7) ma, nei capitoli letti, non ne dà la distanza dal sorgere del sole. Si usa il Comm. Beraḵoṯ 1:1: «בכדי שעה וחומש שעה מן השעות הזמניות», intese come ore stagionali del giorno (lettura nostra). <i>Impostazione: mostra / nascondi.</i></p>
<h4>Orari del giorno <span class="st">MT</span></h4><p>Shemaʿ del mattino: fine della 3ª ora (Qeriʾaṯ Shemaʿ 1:12–14). Shaḥriṯ: fino alla fine della 4ª ora (Tefillà 3:1). Musaf: fino alla fine della 7ª ora, solo nei giorni con Musaf (3:5). Minḥà geḏolà da 6½, qeṭannà da 9½, finché del giorno resta un’ora e un quarto, e si può pregare fino al tramonto (3:2, 3:4). Mezzanotte: fine preferibile dello Shemaʿ della sera (Qeriʾaṯ Shemaʿ 1:10); il MT non la definisce, la calcoliamo a metà fra il tramonto e il sorgere del sole <span class="st">dedotto</span>.</p>
<h4>Accensione dei lumi <span class="st">MT</span></h4><p>Non mostrata: il MT dice solo «מבעוד יום, קודם שקיעת החמה» (Shabbaṯ 5:3), senza minuti.</p>
<h4>Sole <span class="st">scelta</span></h4><p>Sorgere e tramonto a livello del mare, senza correzione per l’altitudine (i passi letti non ne parlano). Algoritmo NOAA; differenza dagli orari di Zemaneh Yosef per Ferrara: entro il minuto.</p>
<h4>Arrotondamento <span class="st">scelta</span></h4><p>Con l’arrotondamento prudente i termini finali sono arrotondati al minuto precedente, gli inizi al minuto seguente. Non è una regola del MT. <i>Impostazione: sì / no.</i></p>
<h4>Nefilaṯ appàyim <span class="st">MT · scelta</span></h4><p>Non si fa: Shabbaṯ, feste e Ḥol ha-moʿeḏ («מועדות»; Ḥol ha-moʿeḏ incluso per scelta), Rosh ha-Shanà, Rosh Ḥòḏesh, Ḥanukkà, Purim, Minḥà della vigilia di Shabbaṯ e di festa (Tefillà 5:16 [15]). Di sera non si fa mai («ולא בערבית שבכל יום»), tranne a Yom ha-Kippurim, quando si fa in ogni preghiera; per questo ʿArḇiṯ compare solo quel giorno. In tutti gli altri giorni si fa, anche il 9 di Aḇ e a Minḥà della vigilia di Kippur: i «ימים טובים» sono i sei giorni elencati in Sheḇiṯaṯ Yom Ṭoḇ 1:1, tra cui Kippur non c’è, e Tefillà 5:16 tratta Kippur come caso a sé. Applicare la definizione di 1:1 alla norma sulla preghiera è una nostra lettura, approvata come scelta.</p>
<h4>Pioggia <span class="st">MT · rito italiano</span></h4><p>Menzione nella seconda benedizione da Musaf di Sheminì ʿAṣèreṯ (diaspora: primo giorno) fino a Shaḥriṯ del primo giorno di Pèsaḥ (Tefillà 2:17 [15], 2:19 [17]). Formula del rito italiano: «משיב הרוח ומוריד הגשם»; d’estate nulla (non «מוריד הטל»). Richiesta in Birkaṯ ha-shanim, con la formula del Maḥazor del proprietario, del rito italiano più antico: d’inverno si aggiunge l’intera frase «ותן טל ומטר לברכה על פני האדמה ושבע את העולם מברכותיך» (Piattelli invece aggiunge solo «ומטר» a «ותן טל לברכה»), e l’app la mostra, come la menzione, solo nei giorni in cui si dice e la sera prima dell’inizio; la nota in italiano compare, su una riga a sé sotto la formula, solo nei giorni di cambio <span class="st">rito italiano</span>. In Israele dal 7 di Marḥeshwan; nella diaspora dal 60° giorno dopo la tequfà di Tishrì, contando come 1° il giorno della tequfà, finché si menziona la pioggia (2:18 [16]). Il MT nomina Shinʿar, Siria ed Egitto «והדומין להן»: l’applicazione all’Europa è nostra. Il MT dà il giorno ma non la preghiera, mentre per la menzione nomina Musaf e Shaḥriṯ; poiché il giorno comincia la sera, si comincia a ʿArḇiṯ della sera prima o, se quel giorno è Shabbaṯ, alla prima preghiera di ʿArḇiṯ feriale seguente <span class="st">dedotto · scelta</span>. L’ultima richiesta è a Minḥà dell’ultimo giorno feriale prima del 15 Nisan. La sera prima la nota avverte che si comincia a ʿArḇiṯ; anche la nota del primo e dell’ultimo giorno lo segnala.</p>
<h4>Aggiunte alla ʿAmiḏà <span class="st">MT · scelta</span></h4><p>Nei dieci giorni da Rosh ha-Shanà a Yom ha-Kippurim «המלך הקדוש» nella 3ª benedizione e «המלך המשפט» nell’11ª, che c’è solo nella ʿAmiḏà feriale (Tefillà 2:20 [18]); a Rosh Ḥòḏesh e Ḥol ha-moʿeḏ «יעלה ויבוא» nella ʿAḇoḏà (2:12–13 [10–11]); a Ḥanukkà e Purim «על הניסים» nella Hoḏayà (2:15 [13]); nei digiuni «עננו» in Shomeaʿ tefillà, e l’officiante ne fa una benedizione a sé fra Goʾel e Rofé; il 9 di Aḇ anche «רחם» in Boné Yerushalàyim (2:16 [14]). Il MT non dice in quali preghiere: si dicono in tutte quelle del digiuno, cioè il 9 di Aḇ a ʿArḇiṯ (nota la sera prima), Shaḥriṯ e Minḥà, negli altri digiuni a Shaḥriṯ e Minḥà, con la nota «chi digiuna», perché solo Kippur e il 9 di Aḇ sono obbligatori <span class="st">scelta</span>. Le formule sono quelle del rito italiano: «עננו יי עננו» (Piattelli, dal manoscritto del 1265 e dal Maḥazor di Bologna; il MT ha «עננו אבינו») e «רחם יי אלהינו עלינו», detto in ogni preghiera del 9 di Aḇ.</p><p>Il giorno civile ha Shaḥriṯ e Minḥà del suo giorno ebraico e ʿArḇiṯ del seguente: perciò il giorno prima compare «da ʿArḇiṯ di stasera» e l’ultimo giorno «fino a Minḥà». A Kippur la nota dice «fino a Neʿilà»: «עד מוצאי יום הכיפורים» non dice se vi sia compresa ʿArḇiṯ dell’uscita di Kippur, che torna a «האל הקדוש» <span class="st">scelta</span>. Gli usi di 2:21 [19] («יש מקומות שנהגו»: זוכרנו, מי כמוך, זכור רחמיך, ובספר חיים, ובכן) non si mostrano.</p>
<h4>Cambi stagionali <span class="st">scelta</span></h4><p>Le note che aprono o chiudono un cambio (menzione e richiesta della pioggia, aggiunte alla ʿAmiḏà) sono evidenziate.</p>
<h4>Tequfà <span class="st">MT · scelta</span></h4><p>Si usa il cap. 9 di Qiddush ha-Ḥòḏesh (anno di 365¼ giorni; tequfà di Nisan dell’anno 1 = 7 giorni, 9 ore e 642 ḥalaqim prima del molad, 9:3). Il cap. 10 (365 giorni, 5 ore, 997 ḥalaqim e 48 regaʿim; 9 ore e 642 ḥalaqim prima del molad, 10:3) è detto «האמת יותר» (10:6) e anticipa la richiesta di circa 11 giorni (nel 2026 il 60° giorno cade il 24 novembre invece del 5 dicembre). <i>Impostazione: cap. 9 / cap. 10.</i></p>
<h4>Digiuni <span class="st">MT · dedotto · scelta</span></h4><p>Si segnano il 3 di Tishrì, il 10 di Ṭeḇeṯ, il 17 di Tammuz e il 9 di Aḇ (Taʿaniyyoṯ 5:2–4); quello che cade di Shabbaṯ si rinvia a domenica («דוחין אותו לאחר השבת», 5:5). Il digiuno di Ester, il 13 di Aḏar, è un uso («ונהגו»); se il 13 cade di Shabbaṯ si anticipa a giovedì 11 (5:5). Negli anni embolismici lo mettiamo in Aḏar II, come la lettura della Meḡillà (Meḡillà 1:12) <span class="st">dedotto</span>. Nella nota del giorno compare la lettura della Torà: «ויחל משה» a Shaḥriṯ e a Minḥà; il 9 di Aḇ a Shaḥriṯ «כי תוליד בנים» (5:5; Tefillà 13:18). Il 17 di Tammuz si segue il rito italiano, scostandosi dal MT <span class="st">scelta</span>: come nel Maḥazor di Bologna del 1540–41 si legge di seguito, senza saltare, «ויחל משה ויפן וירד הכל על הסדר לפי שהוא כעין המאורע שבשבעה עשר בתמוז נשתברו הלוחות»; nel manoscritto romano del 1265 (Parigi, BnF hébr. 599) è uso di alcuni luoghi, e l’app ricorda che alcuni leggono come negli altri digiuni, secondo il MT. Le altre letture dei digiuni in questi testimoni coincidono con il MT. Il 9 di Aḇ comincia la sera prima: «ובין השמשות שלו, אסור כיום הכיפורים» (5:7), per questo, la vigilia, la riga del tramonto lo segnala. Ogni digiuno finisce all’uscita delle stelle, con la stessa impostazione di 20 o 18 minuti <span class="st">scelta</span>: i passi letti non dicono quando finisca un digiuno, né quando comincino i digiuni diurni, per i quali non si mostra un orario di inizio. I nomi צום גדליה e תענית אסתר sono quelli d’uso, non le parole del MT.</p>
<h4>Conteggio del ʿÒmer <span class="st">MT · scelta</span></h4><p>Si contano di notte, dalla notte del 16 Nisan, i giorni insieme alle settimane: «ומצוה למנות הימים, עם השבועות… מונה בלילה, מליל שישה עשר בניסן» (Temiḏin u-Musafin 7:19 [22]). La nota compare nel giorno civile la cui sera apre il giorno da contare («stasera si conta…»).</p>
<h4>Le quattro parashiyyoṯ e Shabbaṯ ha-Gaḏol <span class="st">MT · dedotto · scelta</span></h4><p>Nella scheda della parashà compare il nome dello Shabbaṯ (שבת שקלים, Shabbaṯ Sheqalim, e così gli altri): Sheqalim il sabato di Rosh Ḥòḏesh Aḏar o quello prima; Zaḵor il sabato della settimana in cui cade Purim; Parà il sabato prima di Ha-ḥòḏesh; Ha-ḥòḏesh il sabato della settimana di Rosh Ḥòḏesh Nisan, «ואפילו בערב שבת» (Tefillà 13:20). Negli anni embolismici si conta da Aḏar II, perché 13:21 ammette al massimo un sabato di intervallo fra Sheqalim e Zaḵor; Zaḵor si calcola dal 14 anche dove Purim è il 15 <span class="st">dedotto</span>. Shabbaṯ ha-Gaḏol, il sabato prima di Pèsaḥ, è segnato per scelta: nei passi letti del MT non compare. Digiuni, ʿÒmer e Shabbaṯoṯ con nome sono confrontati con Hebcal per 600 anni: nessuna differenza.</p>
<h4>Non segnati <span class="st">scelta</span></h4><p>Le restrizioni da Rosh Ḥòḏesh Aḇ e nella settimana del 9 di Aḇ (Taʿaniyyoṯ 5:6); Lag la-ʿÒmer e le ricorrenze israeliane moderne, per cui non abbiamo trovato una base nel MT; Ṭu bi-Shḇaṭ, Ṭu be-Aḇ, Pèsaḥ Shenì e Purim Qaṭan, ancora da verificare nel MT.</p>
<h4>Israele, secondo giorno di festa, Purim <span class="st">scelta</span></h4><p>Israele o diaspora si ricava dalla posizione (confine approssimativo). Purim il 15 entro circa 6 km dalla Città Vecchia di Gerusalemme, altrimenti il 14; negli anni embolismici in Aḏar II. <i>Impostazioni: automatico / sì / no.</i></p>
<h4>Parashiyyoṯ <span class="st">verificato</span></h4><p>Lettura annuale (Tefillà 13:1). Calcolate con un algoritmo nostro e confrontate con la libreria Hebcal per 600 anni (5600–6199), in Israele e nella diaspora: nessuna differenza. Si mostra la lettura del luogo scelto; quando Israele e diaspora leggono parashiyyoṯ diverse, compare sotto anche l’altra.</p>
<h4>Letture diverse in Israele e nella diaspora <span class="st">scelta</span></h4><p>Quando nella diaspora l’ultimo giorno di Pèsaḥ o il secondo di Shaḇuʿoṯ cade di sabato, lì la lettura è quella della festa e in Israele la parashà seguente; le letture tornano a coincidere quando la diaspora unisce due parashiyyoṯ. In queste settimane, il primo sabato una nota sotto l’altra lettura spiega perché le letture divergono; ogni settimana la nota indica la data in cui si riallineano. È un dato del calendario, non una norma del MT; controllato per gli anni 5600–6199.</p>
<h4>Lingue <span class="st">scelta</span></h4><p>I termini ebraici compaiono sempre; le didascalie possono essere in italiano, inglese o francese, oppure si può scegliere il solo ebraico. Nelle didascalie italiane l’accento (à, è per il seḡol, é per lo ṣeré, ì, ò, ù) segna la sillaba tonica solo dove non è quella attesa, come nell’ortografia italiana: una parola che finisce in vocale si legge piana, e l’accento segna le tronche (Minḥà, Ḥayyé Sarà, Teṣawwè, Wayḥì, Tishrì); una parola che finisce in consonante si legge tronca, e l’accento segna le piane (Sheminì ʿAṣèreṯ, Pèsaḥ, Rosh Ḥòḏesh, ʿÉqeḇ). Quindi Haʾazinu, piana in vocale, resta senza accento, come i monosillabi (Bo, Noaḥ). La sillaba tonica è quella degli accenti masoretici. L’ʾalef consonantico si scrive (Reʾé, Haʾazinu, Waʾerà, Qeriʾaṯ), tranne a inizio di parola, anche dopo il trattino (Emor, be-Aḇ); quello quiescente no (Bereshiṯ, Wayyiqrà). In inglese e francese le stesse forme senza accento (Minḥa, Ḥayye Sara). In tutte le lingue le lettere refuyyoṯ ג e ד si scrivono ḡ e ḏ, e פ si scrive f (Meḡillà, Ḥòḏesh, Tefillà). Per כ e ת si sceglie fra kh, th (Berakhoth) e <span class="fix">&#7733;, &#7791; (Bera&#7733;o&#7791;)</span>; per ב, a parte, perché il suo trattamento è meno concorde, fra <span class="fix">&#7687;</span> e v (<span class="fix">She&#7687;aṭ</span>, Shevaṭ). <i>Impostazioni: kh, th / <span class="fix">&#7733;, &#7791;</span>; <span class="fix">&#7687;</span> / v.</i> Dopo uno shewà quiescente la lettera è semplice (Bemiḏbar), ma si scrive ʿArḇiṯ. Dopo il trattino (articolo, prefissi) la geminazione non si scrive: il trattino la sostituisce (ha-koḵaḇim). Il titolo della parashà è Tazriaʿ, nella forma del titolo e non Ṯazriaʿ. Le scritte in ebraico seguono la grafia difettiva tradizionale (תפלה, צבור, ספירת העמר). I nomi delle città in ebraico seguono la grafia degli ebrei italiani (alef per la a, yod per la e: פאדובה, ויניציאה, בולונייא, רומא), con le forme tradizionali dove esistono (פאריש). Per i nomi non ancora attestati valgono queste regole: vocale iniziale e vocale dopo vocale con alef (אימולא, טריאיסטי); nessuna lettera doppia; -a finale א, -e e -i finali י, -o finale ו; c dolce צ, c dura ק; g dolce ג con yod (ריגיו, גינובא); gn ניי (בולונייא); gli לי (קאליארי); sc dolce ש (ברישא); z צ, ma ז dove è sonora (per i comuni italiani, secondo il DiPI di Canepari, e dove manca secondo Wikipedia: Lazise, Zevio, Monza); s fra vocali ז, come nella pronuncia moderna del DiPI, ma ס dove il DiPI ha la s sorda, di solito nei composti (Camposanto, Pietrasanta); v iniziale ו, fra vocali ב, accanto a consonante וו (סילוואנו); lettere finali (סאן). Le forme attestate prevalgono sempre (ליוורנו, רוויגו, סאלוצצו, וירציללי, קוני). Fuori d’Italia si scrive la pronuncia del luogo, non la sua grafia, con le lettere degli ebrei italiani e secondo la grammatica ebraica (ליאון per Lyon); anche lì prevalgono le forme ebraiche attestate, da vagliare una per una. Le regole italiane valgono, sul nome italiano, anche nel Canton Ticino, nei Grigioni italiani, a San Marino, nel Vaticano, in Corsica, a Nizza, a Monaco, in Istria e in Dalmazia. In francese: e ed ai י, o, au, ou e u ו, eu יו (באייו), oi וא (בלוא, come לואי nei gittin dell’Ottocento), la e muta non si scrive (ניס, בזאנסון); vocali nasali con נ (אן, ין, ון, e יון per un); ch, j e g dolce ש (שאמוני, דישון: così i rabbini francesi e alsaziani scrivevano שאן per Jean); c dolce, ç e s ס (נאנסי), s fra vocali e z ז (טולוז); gn ניי, ill יי (מארסיי); le consonanti finali mute non si scrivono (בורדו); l’articolo le si unisce al nome (לאבר). Alsazia e Mosella seguono il tedesco sul nome tedesco (מיץ, שטראסבורג). In tedesco (Germania, Austria, Svizzera tedesca, Liechtenstein) si segue l’uso degli ebrei tedeschi: e, ä, ö ע (ברעמען, קעלן); ü י (מינכען); ei, eu יי, au וי (מיינץ, פאסוי); -e finale ע; ch כ, non ח (come vuole Isserlein); sch e s davanti a p e t a inizio di sillaba ש (שפייער, שטוטגארט); s davanti a vocale ז; z צ; w וו; v e f פ; le consonanti finali si scrivono come si pronunciano, -burg בורק come in Isserlein (האמבורק, דארמשטאט). In spagnolo (Spagna, col nome castigliano anche in Catalogna, Galizia e Paesi Baschi; America ispanica): vocali come in italiano, -a finale א (גראנאדא); b e v ב; c dolce, z e s ס, anche fra vocali (סאראגוסא, מינדוסא); ch צ come la c dolce italiana; j ח (חיריס); ll לי come gli (סיביליא); ñ ניי. In inglese la grafia non dice la pronuncia: si scrive la pronuncia presa da un dizionario di pronuncia, e senza questo dato solo il nome latino. Le vocali atone seguono la lettera della grafia inglese (קובינטרי, לונדון, בירמינגאם); ch צ, j גי (גירזי), sh ש, th ת o ד secondo il suono (פלימות, רודירהאם), w וו; la r dopo vocale si scrive dove c’è nella grafia (מאנציסטיר); le lettere mute no (גריניץ). Il Québec segue il francese. Nell’Est ashkenazita (Polonia, paesi baltici, Bielorussia, Ucraina, Moldavia, Russia, Ungheria, Romania, Cechia, Slovacchia) si usa il nome ebraico tradizionale nella forma dei frontespizi e delle lettere rabbiniche (ווילנא, ווארשא, קראקא, הוראדנא, לבוב, בריסק), e dove manca la forma yiddish, senza la puntazione YIVO; per gli altri luoghi si scrive la pronuncia locale: o א, e ע, -a finale א, w e v וו, -ów וב, cz טש, sz ש, ż e rz ז, ch ח (זאמאשטש, פאלטאווא, קישינעו). In tutte le lingue nessuna lettera doppia e le lettere finali. Altrove solo il nome latino, salvo le eccezioni; in Israele la grafia israeliana, salvo una forma più tradizionale. Queste note restano in italiano. <i>Impostazione: italiano / English / Français / solo ebraico.</i></p>
<h4>Fuso orario <span class="st">scelta</span></h4><p>Per le città dell’elenco si usa il fuso orario della città; con la posizione GPS, quello del dispositivo.</p>
<h4>Hafṭaroṯ <span class="st">scelta</span></h4><p>Non si mostrano, per tenere l’interfaccia più pulita. Dopo qualche mese d’uso si valuterà una variante con le hafṭaroṯ.</p>
<h4>Da fare</h4><p>Un logo adatto per l’icona dell’app, anche nella versione per Android. Il nome del luogo ricavato dalla posizione del telefono, in ebraico secondo le regole qui sopra. Il luogo si cercherà sul telefono, in un elenco di località incluso nell’app (GeoNames), senza mandare la posizione in rete; il nome si potrà poi correggere a mano. La ricerca in rete sarà un’impostazione a parte, disattivata in partenza. L’elenco delle eccezioni, cioè dei luoghi con un nome ebraico tradizionale, è deciso; resta da scrivere il codice. Dopo alcuni mesi d’uso, valutare una variante con le hafṭaroṯ.</p>
